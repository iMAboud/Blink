name: Release Blink Application

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Next Version
        id: versioning
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $url = "https://api.github.com/repos/$repo/releases/latest"
          $headers = @{ "User-Agent" = "GitHub-Action" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }

          $latestTag = "1.0"
          try {
              $response = Invoke-RestMethod -Uri $url -Headers $headers -ErrorAction Stop
              if ($response.tag_name) {
                  $latestTag = $response.tag_name.TrimStart('v', 'V')
              }
          } catch {
              Write-Host "No previous release found or error fetching latest release. Baseline version 1.0 will be used."
          }

          $major = 1
          $minor = 0
          if ($latestTag -match '^\d+\.\d+') {
              $parts = $latestTag.Split('.')
              $major = [int]$parts[0]
              $minor = [int]$parts[1] + 1
          }
          $newVersion = "$major.$minor"
          $fullVersion = "$major.$minor.0"

          Write-Host "Latest Release Tag: $latestTag"
          Write-Host "New Release Tag: $newVersion"

          echo "NEW_VERSION=$newVersion" >> $env:GITHUB_ENV
          echo "FULL_VERSION=$fullVersion" >> $env:GITHUB_ENV

      - name: Update Version in Directory.build.props
        shell: pwsh
        run: |
          (Get-Content Directory.build.props) -replace '<Version>.*?</Version>', "<Version>$env:FULL_VERSION</Version>" | Set-Content Directory.build.props

      - name: Build Single-Executable Release
        shell: pwsh
        run: |
          .\build_release.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:NEW_VERSION" Release/Blink.exe --title "Blink v$env:NEW_VERSION" --notes "Automated release $env:NEW_VERSION"
