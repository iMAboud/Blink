name: Release Blink Application

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Next Version
        id: versioning
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $maxMajor = 1
          $maxMinor = 0

          # Get existing tags from git and gh release list
          $gitTags = git tag -l
          $ghReleases = try { gh release list --limit 100 | ForEach-Object { ($_ -split '\s+')[0] } } catch { @() }
          $allTags = ($gitTags + $ghReleases) | Where-Object { $_ -match '^\s*v?\d+\.\d+' }

          foreach ($tag in $allTags) {
              $cleanTag = $tag.Trim().TrimStart('v', 'V')
              if ($cleanTag -match '^(\d+)\.(\d+)') {
                  $maj = [int]$Matches[1]
                  $min = [int]$Matches[2]
                  if ($maj -gt $maxMajor) {
                      $maxMajor = $maj
                      $maxMinor = $min
                  } elseif ($maj -eq $maxMajor -and $min -gt $maxMinor) {
                      $maxMinor = $min
                  }
              }
          }

          $newMinor = $maxMinor + 1
          $newVersion = "$maxMajor.$newMinor"
          $fullVersion = "$maxMajor.$newMinor.0"

          Write-Host "Highest existing tag/release found: $maxMajor.$maxMinor"
          Write-Host "New Release Tag: $newVersion"
          Write-Host "Full Version: $fullVersion"

          echo "NEW_VERSION=$newVersion" >> $env:GITHUB_ENV
          echo "FULL_VERSION=$fullVersion" >> $env:GITHUB_ENV

      - name: Update Version in Directory.build.props
        shell: pwsh
        run: |
          (Get-Content Directory.build.props) -replace '<Version>.*?</Version>', "<Version>$env:FULL_VERSION</Version>" | Set-Content Directory.build.props

      - name: Build Single-Executable Release
        shell: pwsh
        run: |
          .\build_release.ps1 -Version "$env:FULL_VERSION"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:NEW_VERSION" Release/Blink.exe --title "Blink v$env:NEW_VERSION" --notes "Automated release $env:NEW_VERSION" --clobber
